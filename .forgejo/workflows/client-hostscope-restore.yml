name: Restore Client HostScope Snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot ID to restore (from the deploy job output)
        required: true
        type: string
      confirmation:
        description: Type restore-hostscope-snapshot to confirm
        required: true
        type: string

concurrency:
  group: client-hostscope-restore
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ github.event.inputs.confirmation == 'restore-hostscope-snapshot' }}
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
      HOSTSCOPE_DEPLOY_HOST: ${{ vars.HOSTSCOPE_DEPLOY_HOST }}
      HOSTSCOPE_DEPLOY_PORT: ${{ vars.HOSTSCOPE_DEPLOY_PORT }}
      HOSTSCOPE_DEPLOY_USER: ${{ vars.HOSTSCOPE_DEPLOY_USER }}
      HOSTSCOPE_DEPLOY_PATH: ${{ vars.HOSTSCOPE_DEPLOY_PATH }}
      HOSTSCOPE_DEPLOY_KNOWN_HOSTS: ${{ vars.HOSTSCOPE_DEPLOY_KNOWN_HOSTS }}
      HOSTSCOPE_SNAPSHOT_PATH: ${{ vars.HOSTSCOPE_SNAPSHOT_PATH }}
      HOSTSCOPE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.HOSTSCOPE_DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Validate restore settings
        shell: bash
        run: |
          set -euo pipefail
          for setting in SNAPSHOT_ID HOSTSCOPE_DEPLOY_HOST HOSTSCOPE_DEPLOY_USER HOSTSCOPE_DEPLOY_PATH HOSTSCOPE_DEPLOY_KNOWN_HOSTS HOSTSCOPE_SNAPSHOT_PATH HOSTSCOPE_DEPLOY_SSH_PRIVATE_KEY; do
            test -n "${!setting}" || { echo "Missing required restore setting: $setting"; exit 1; }
          done
          case "$SNAPSHOT_ID" in *[!A-Za-z0-9._-]*|'') echo 'Invalid snapshot ID.' >&2; exit 1;; esac

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTSCOPE_DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/hostscope_deploy_key"
          printf '%s\n' "$HOSTSCOPE_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hostscope_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Install rsync
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null || { apt-get update; apt-get install -y rsync; }

      - name: Snapshot the current site before restore
        id: pre_restore_snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup_id="pre-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_SHA}"
          printf 'id=%s\n' "$backup_id" >> "$GITHUB_OUTPUT"
          ssh -i "$HOME/.ssh/hostscope_deploy_key" -p "${HOSTSCOPE_DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${HOSTSCOPE_DEPLOY_USER}@${HOSTSCOPE_DEPLOY_HOST}" \
            bash -s -- "$HOSTSCOPE_DEPLOY_PATH" "$HOSTSCOPE_SNAPSHOT_PATH" "$backup_id" <<'REMOTE'
          set -eu
          site=$1
          snapshots=$2
          snapshot_id=$3
          case "$snapshots" in "$site"|"$site"/*) echo 'Snapshot path must be outside the deploy path.' >&2; exit 1;; esac
          snapshot="$snapshots/$snapshot_id"
          test ! -e "$snapshot" || { echo "Snapshot already exists: $snapshot" >&2; exit 1; }
          mkdir -p "$snapshot/site" "$snapshot/databases"
          rsync -a --delete --exclude='*.db' --exclude='*.db-*' --exclude='*.sqlite' --exclude='*.sqlite-*' --exclude='*.sqlite3' --exclude='*.sqlite3-*' "$site/" "$snapshot/site/"
          if [ -d "$site/data" ]; then
            command -v sqlite3 >/dev/null || { echo 'sqlite3 is required on the deployment server for safe snapshots.' >&2; exit 1; }
            find "$site/data" -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print0 |
              while IFS= read -r -d '' database; do
                relative=${database#"$site"/}
                destination="$snapshot/databases/$relative"
                mkdir -p "$(dirname "$destination")"
                sqlite3 "$database" ".backup '$destination'"
              done
          fi
          printf '%s\n' "$snapshot_id" > "$snapshot/SNAPSHOT_ID"
          REMOTE

      - name: Restore application and database snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostscope_deploy_key" -p "${HOSTSCOPE_DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${HOSTSCOPE_DEPLOY_USER}@${HOSTSCOPE_DEPLOY_HOST}" \
            bash -s -- "$HOSTSCOPE_DEPLOY_PATH" "$HOSTSCOPE_SNAPSHOT_PATH" "$SNAPSHOT_ID" <<'REMOTE'
          set -eu
          site=$1
          snapshots=$2
          snapshot_id=$3
          snapshot="$snapshots/$snapshot_id"
          test -f "$snapshot/SNAPSHOT_ID" || { echo "Unknown snapshot: $snapshot_id" >&2; exit 1; }
          test -d "$snapshot/site" || { echo "Snapshot site files are missing." >&2; exit 1; }
          # Leave the database files out of this pass; they are restored from
          # SQLite's consistent .backup copies below, never from a WAL copy.
          rsync -a --delete --exclude='data/***' --exclude='.well-known/' "$snapshot/site/" "$site/"
          if [ -d "$snapshot/site/data" ]; then
            rsync -a --delete \
              --exclude='*.db' --exclude='*.db-*' \
              --exclude='*.sqlite' --exclude='*.sqlite-*' \
              --exclude='*.sqlite3' --exclude='*.sqlite3-*' \
              "$snapshot/site/data/" "$site/data/"
          fi
          if [ -d "$snapshot/databases" ]; then
            find "$snapshot/databases" -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print0 |
              while IFS= read -r -d '' source; do
                relative=${source#"$snapshot/databases"/}
                destination="$site/$relative"
                mkdir -p "$(dirname "$destination")"
                rm -f "${destination}-wal" "${destination}-shm" "${destination}-journal"
                rsync -a "$source" "$destination"
              done
          fi
          REMOTE

      - name: Report restore safety snapshot
        run: 'echo "Current site preserved first as ${{ steps.pre_restore_snapshot.outputs.id }}"'

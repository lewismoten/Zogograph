name: Deploy Zogograph Remote Demo
on: {push: {branches: [main]}, workflow_dispatch: {}}
concurrency: {group: zogograph-remote-demo-deploy, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_URL DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY; do test -n "${!setting}" || { echo "Missing $setting" >&2; exit 1; }; done
          case "$DEPLOY_PATH" in /*) ;; *) echo 'DEPLOY_PATH must be absolute.' >&2; exit 1;; esac
          case "$DEPLOY_PATH" in *[!A-Za-z0-9._/-]*) echo 'DEPLOY_PATH is unsafe.' >&2; exit 1;; esac
      - run: npm ci && npm test && npm run build
      - run: test -s dist/index.html
      - name: Deploy and smoke test
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"; printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          rsync -az --delete -e "ssh -i $HOME/.ssh/deploy_key -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes" dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$DEPLOY_URL" >/dev/null
